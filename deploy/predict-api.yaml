# 予測API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: predict-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: predict-api}
  template:
    metadata:
      labels: {app: predict-api}
    spec:
      containers:
        - name: predict-api
          image: tonjiru-predict-api:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MODEL_NAME
              value: tonjiru-sales
            # ★ 本番で使うモデルのバージョン。ここを書き換えて PR → マージ → Argo CD が反映
            - name: MODEL_VERSION
              value: "2"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: predict-api
spec:
  selector: {app: predict-api}
  ports:
    - port: 8000
      targetPort: 8000
