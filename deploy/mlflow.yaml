# MLflow サーバー（実験の記録とモデルの登録先）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  # MLflow は SQLite を使うので、2つのPodが同時に動かないよう、古いPodを先に止める
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.18.0
          command:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --artifacts-destination=/mlflow/artifacts
            - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
            # 一人で使う練習環境なので、受付窓口（ワーカー）は1つで十分
            - --workers=1
          env:
            # 使わない「ジョブ実行」機能を止める（起動時のメモリ削減と、CVE-2026-0545の回避）
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
              value: "false"
          resources:
            requests:
              memory: 576Mi
            limits:
              memory: 1Gi
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /mlflow
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  selector: {app: mlflow}
  ports:
    - port: 5000
      targetPort: 5000
